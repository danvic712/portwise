name: Build and test

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.16.x'
          cache: pnpm
          cache-dependency-path: src/Portwise.Web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: src/Portwise.Web
        run: pnpm install --frozen-lockfile

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Portwise.slnx', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore .NET dependencies
        run: dotnet restore Portwise.slnx

      - name: Build solution
        run: dotnet build Portwise.slnx --configuration Release --no-restore

      - name: Generate and verify frontend API contract
        working-directory: src/Portwise.Web
        run: pnpm api:generate

      - name: Check frontend API contract drift
        working-directory: src/Portwise.Web
        run: pnpm api:check

      - name: Build frontend
        working-directory: src/Portwise.Web
        run: pnpm build

      - name: Run tests
        run: dotnet test Portwise.slnx --configuration Release --no-build --no-restore
