services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portwise}
      POSTGRES_USER: ${POSTGRES_USER:-portwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portwise_dev_only}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - portwise-postgres:/var/lib/postgresql/data
      - ./deploy/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  portwise:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      DataProtection__KeysPath: /app/keys
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-portwise};Username=${POSTGRES_USER:-portwise};Password=${POSTGRES_PASSWORD:-portwise_dev_only}
    ports:
      - "${PORTWISE_HOST_PORT:-8080}:8080"
    volumes:
      - portwise-keys:/app/keys
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet http://127.0.0.1:8080/readyz || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  portwise-postgres:
  portwise-keys:
